<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-10%" y="-40%" width="130%" height="180%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.3" flood-color="#000" flood-opacity="1"/>
    </filter>
    <clipPath id="clipL"><rect x="24" y="80" width="340" height="152" rx="8"/></clipPath>
    <clipPath id="clipR"><rect x="396" y="80" width="340" height="152" rx="8"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ccc"/>
    </marker>

    <!-- Vereinfachtes Horde-Wappen (nur Mock, im Spiel Client-Textur) -->
    <symbol id="horde" viewBox="0 0 16 16">
      <path d="M8 0L10.5 2.6L14.5 1.5L13 6L16 8.5L11.2 8.6L9.6 16H6.4L4.8 8.6L0 8.5L3 6L1.5 1.5L5.5 2.6Z" fill="#e01010" stroke="#000" stroke-width="0.5"/>
      <ellipse cx="8" cy="6.2" rx="2.6" ry="3" fill="none" stroke="#fff" stroke-width="1.3"/>
      <path d="M8 4.6L9 6.2L8 7.8L7 6.2Z" fill="#e01010"/>
    </symbol>
    <!-- Vereinfachtes Allianz-Wappen (nur Mock, im Spiel Client-Textur) -->
    <symbol id="alliance" viewBox="0 0 16 16">
      <path d="M8 0.6C10.8 1.2 13.6 2.2 14.6 4.6C14.8 9.6 11.6 13.6 8 15.6C4.4 13.6 1.2 9.6 1.4 4.6C2.4 2.2 5.2 1.2 8 0.6Z" fill="#000" fill-opacity="0.35" stroke="#2f7fd6" stroke-width="1.5"/>
      <path d="M4.6 5.2L8 6.8L11.4 5.2L10.6 9.8L8 12.4L5.4 9.8Z" fill="#2f7fd6"/>
      <path d="M7.4 3.2H8.6V5.6H7.4Z" fill="#2f7fd6"/>
    </symbol>

    <!-- Spielwelt-Hintergrund -->
    <g id="world">
      <rect x="0" y="80" width="340" height="152" fill="#2b3a2c"/>
      <circle cx="60" cy="120" r="70" fill="#4d6b3a" opacity="0.8"/>
      <circle cx="230" cy="200" r="80" fill="#3a5a7a" opacity="0.8"/>
      <circle cx="300" cy="96" r="54" fill="#8a6a3a" opacity="0.8"/>
      <circle cx="130" cy="230" r="60" fill="#6a3a4a" opacity="0.8"/>
    </g>

    <!-- Freundeszeilen (weiß mit Kontur/Schatten), Zone steht im Tooltip -->
    <g id="rows">
      <g filter="url(#shadow)">
        <!-- Sortierung oben nach unten: erst R, dann F, jeweils nach Freundesname -->
        <text x="14" y="136" font-weight="700" fill="#E8B83A">R</text>
        <text x="30" y="136" fill="#fff">Lena</text>
        <text x="89" y="136" font-weight="600" fill="#FF7C0A">Sylvarin</text>
        <text x="155" y="136" fill="#bbb">(90)</text>

        <text x="14" y="156" font-weight="700" fill="#E8B83A">R</text>
        <text x="30" y="156" fill="#fff">Tobi</text>
        <text x="89" y="156" font-weight="600" fill="#C69B6D">Grimhold</text>
        <text x="155" y="156" fill="#bbb">(88)</text>

        <text x="14" y="176" font-weight="700" fill="#3FB8AF">F</text>
        <text x="30" y="176" fill="#fff">Jonas</text>
        <text x="95" y="176" font-weight="600" fill="#F48CBA">Brightwen</text>
        <text x="172" y="176" fill="#bbb">(47)</text>

        <text x="14" y="196" font-weight="700" fill="#3FB8AF">F</text>
        <text x="30" y="196" fill="#fff">Mara</text>
        <text x="89" y="196" font-weight="600" fill="#0070DD">Kaelthor</text>
        <text x="155" y="196" fill="#bbb">(60)</text>
      </g>
      <use xlink:href="#alliance" href="#alliance" x="68" y="123.5" width="16" height="16"/>
      <use xlink:href="#horde" href="#horde" x="68" y="143.5" width="16" height="16"/>
      <use xlink:href="#alliance" href="#alliance" x="74" y="163.5" width="16" height="16"/>
      <use xlink:href="#horde" href="#horde" x="68" y="183.5" width="16" height="16"/>
    </g>
  </defs>

  <rect width="760" height="330" fill="#fff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#222">Gesperrt reiner Text, entsperrt mit Griff zum Verschieben</text>
  <text x="24" y="68" font-weight="600" fill="#222">Gesperrt</text>
  <text x="396" y="68" font-weight="600" fill="#222">Entsperrt</text>

  <!-- Gesperrt -->
  <g clip-path="url(#clipL)"><use href="#world" x="24"/></g>
  <use href="#rows" x="24"/>
  <path d="M346 200V112" stroke="#ccc" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
  <text x="354" y="100" text-anchor="end" font-size="11.5" fill="#ddd" filter="url(#shadow)">wächst nach oben, sortiert von oben</text>

  <!-- Entsperrt -->
  <g clip-path="url(#clipR)"><use href="#world" x="396"/></g>
  <rect x="404" y="183" width="188" height="18" rx="3" fill="#fff" opacity="0.15"/>
  <use href="#rows" x="396"/>
  <rect x="410" y="206" width="12" height="12" rx="2" fill="#000" fill-opacity="0.4" stroke="#ddd" stroke-width="1.25"/>
  <path d="M416 208V216M412 212H420" stroke="#ddd" stroke-width="1.25"/>
  <text x="430" y="216" font-size="11.5" fill="#ddd" filter="url(#shadow)">Griff (ziehen zum Verschieben)</text>

  <!-- Tooltip beim Hover über Mara: Ort + Notiz -->
  <rect x="598" y="168" width="156" height="54" rx="4" fill="#0b0b1e" fill-opacity="0.94" stroke="#8a8a9a" stroke-width="1"/>
  <text x="608" y="184" font-size="12" font-weight="600" fill="#fff">Mara</text>
  <text x="608" y="199" font-size="11.5" fill="#ddd">Orgrimmar</text>
  <text x="608" y="214" font-size="11.5" fill="#ffd100">Notiz: Tank aus dem Raid</text>

  <!-- Hinweise -->
  <text x="24" y="258" font-size="11.5" fill="#555">Linksklick: Whisper · Rechtsklick: entsperren · Hover: Ort + Notiz</text>
  <text x="396" y="258" font-size="11.5" fill="#555">Rechtsklick: sperren · Griff ziehen: verschieben</text>
  <text x="24" y="284" font-size="11.5" fill="#555"><tspan fill="#3FB8AF" font-weight="700">F</tspan> = Forever (Türkis #3FB8AF) · <tspan fill="#C9971C" font-weight="700">R</tspan> = Retail (Gold #E8B83A) · Wappen hier vereinfacht, im Spiel Client-Textur</text>
  <text x="24" y="304" font-size="11.5" fill="#555">Charakternamen in echten Klassenfarben (Krieger, Druide, Schamane, Paladin) · Text weiß mit Kontur und Schatten</text>
</svg>
